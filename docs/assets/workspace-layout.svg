<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
  <title id="title">Mi Step 工作区布局与三步操作</title>
  <desc id="desc">顶部为控制中心、音乐与工具栏。下方为一个主区域和三个副任务格。先打开应用，再点击空格收纳；点击已有副任务交换；向外滑出将任务交回系统后台。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff8f2"/><stop offset="1" stop-color="#f8faf9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245c48"/><stop offset="1" stop-color="#183e33"/>
    </linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse"><path d="M0 0L6 3.5L0 7" fill="none" stroke="#369368" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1038" height="638" rx="28" fill="url(#page)" stroke="#d9e7df"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <rect x="42" y="29" width="442" height="580" rx="32" fill="#dce8e1"/>
    <rect x="48" y="23" width="430" height="580" rx="30" fill="#fff" stroke="#b8cbc0" stroke-width="2"/>
    <rect x="62" y="39" width="402" height="113" rx="18" fill="url(#green)"/>
    <circle cx="90" cy="67" r="8" fill="#91d6ad"/>
    <circle cx="113" cy="67" r="8" fill="#5b9d79"/>
    <circle cx="136" cy="67" r="8" fill="#5b9d79"/>
    <rect x="352" y="54" width="42" height="70" rx="17" fill="#ffffff" fill-opacity=".18"/>
    <rect x="405" y="54" width="42" height="70" rx="17" fill="#ffffff" fill-opacity=".30"/>
    <text x="82" y="104" fill="#fff" font-size="20" font-weight="600">控制中心 / 原生音乐</text>
    <text x="82" y="129" fill="#bfdfcf" font-size="13">左右滑动切换面板</text>
    <rect x="62" y="162" width="402" height="40" rx="12" fill="#eef3ef"/>
    <text x="263" y="188" text-anchor="middle" fill="#546d5e" font-size="15">工具栏 · 常用应用</text>
    <rect x="62" y="214" width="284" height="372" rx="16" fill="#f9fbfa" stroke="#c8d9ce"/>
    <rect x="78" y="231" width="252" height="8" rx="4" fill="#dce7e0"/>
    <rect x="78" y="250" width="172" height="7" rx="3.5" fill="#e6ede8"/>
    <text x="204" y="361" text-anchor="middle" fill="#244e38" font-size="30" font-weight="650">主区域</text>
    <text x="204" y="393" text-anchor="middle" fill="#6b8072" font-size="15">点按 · 滚动 · 输入</text>
    <rect x="91" y="485" width="226" height="72" rx="10" fill="#e7eee9"/>
    <g fill="#f9fbfa">
      <rect x="103" y="497" width="202" height="10" rx="3"/>
      <rect x="112" y="515" width="184" height="10" rx="3"/>
      <rect x="153" y="533" width="102" height="10" rx="3"/>
    </g>
    <rect x="358" y="214" width="106" height="116" rx="14" fill="#dcefe2"/>
    <text x="411" y="266" text-anchor="middle" fill="#24523a" font-size="17" font-weight="600">副任务 1</text>
    <text x="411" y="293" text-anchor="middle" fill="#5b7b66" font-size="13">点按交换</text>
    <rect x="358" y="342" width="106" height="116" rx="14" fill="#e4eee7"/>
    <text x="411" y="394" text-anchor="middle" fill="#24523a" font-size="17" font-weight="600">副任务 2</text>
    <text x="411" y="421" text-anchor="middle" fill="#5b7b66" font-size="13">向外滑出</text>
    <rect x="358" y="470" width="106" height="116" rx="14" fill="#f0f5f1" stroke="#b8d0bf" stroke-dasharray="5 5"/>
    <path d="M399 513H423M411 501V525" stroke="#75a587" stroke-width="2.5" stroke-linecap="round"/>
    <text x="411" y="552" text-anchor="middle" fill="#5b7b66" font-size="13">收纳当前应用</text>
    <path d="M333 309H370" fill="none" stroke="#369368" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="539" y="94" fill="#214d36" font-size="30" font-weight="700">把应用留在眼前</text>
    <text x="540" y="126" fill="#708577" font-size="16">一主三副，各有位置，随手交换。</text>
    <g>
      <circle cx="558" cy="199" r="19" fill="#d6eadc"/>
      <text x="558" y="205" text-anchor="middle" fill="#2a6544" font-size="18" font-weight="700">1</text>
      <text x="595" y="198" fill="#254b35" font-size="21" font-weight="650">先打开，再收纳</text>
      <text x="595" y="228" fill="#697e70" font-size="16">主区域打开应用 → 点空格「＋」</text>
    </g>
    <g>
      <circle cx="558" cy="307" r="19" fill="#d6eadc"/>
      <text x="558" y="313" text-anchor="middle" fill="#2a6544" font-size="18" font-weight="700">2</text>
      <text x="595" y="306" fill="#254b35" font-size="21" font-weight="650">点谁，就操作谁</text>
      <text x="595" y="336" fill="#697e70" font-size="16">点击已有副任务，与主区域交换</text>
    </g>
    <g>
      <circle cx="558" cy="415" r="19" fill="#d6eadc"/>
      <text x="558" y="421" text-anchor="middle" fill="#2a6544" font-size="18" font-weight="700">3</text>
      <text x="595" y="414" fill="#254b35" font-size="21" font-weight="650">向外滑出，腾出位置</text>
      <text x="595" y="444" fill="#697e70" font-size="16">任务交回系统后台，空格可以再收纳</text>
    </g>
    <path d="M540 492H970" stroke="#d1e0d5"/>
    <text x="540" y="531" fill="#688371" font-size="15">完整输入集中在主区域</text>
    <text x="540" y="556" fill="#8a9e90" font-size="13">布局示意 · 可选择左侧或右侧副任务区</text>
  </g>
</svg>
